name: Bug report / Signaler un bug
description: Something does not work as expected. / Quelque chose ne marche pas comme prévu.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. You can write in English or in French.
        Merci de prendre le temps de signaler un problème. Tu peux écrire en anglais ou en français.

        **Security issue? / Problème de sécurité ?** Do not open a public issue, see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened? / Que s'est-il passé ?
      description: What did you do, what did you expect, what happened instead? / Ce que tu as fait, ce que tu attendais, ce qui s'est passé.
    validations:
      required: true
  - type: input
    id: camerist
    attributes:
      label: Camerist version / Version de Camerist
      description: Shown at the bottom of the dock. / Affichée en bas du dock.
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: OBS version / Version d'OBS
      placeholder: "31.1.1"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera / Caméra
      placeholder: "DJI Osmo Pocket 3"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Version de Windows
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: OBS log / Journal d'OBS
      description: |
        In OBS: Help > Log Files > Upload Current Log File, then paste the link here.
        Dans OBS : Aide > Fichiers journaux > Envoyer le fichier journal actuel, puis colle le lien ici.
